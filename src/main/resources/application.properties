# ===========================================================================
#  Shoonya Monitor - configuration
# ===========================================================================
server.port=8080
spring.application.name=shoonya-monitor

# ---------------------------------------------------------------------------
#  MODE
#  mock=true  -> generates synthetic ticks, runs with NO credentials.
#  mock=false -> connects to the live Shoonya (Finvasia) feed (needs creds).
# ---------------------------------------------------------------------------
shoonya.mock=true

# ---------------------------------------------------------------------------
#  Shoonya API endpoints (defaults are correct - change only if Finvasia does)
# ---------------------------------------------------------------------------
shoonya.rest-base=https://api.shoonya.com/NorenWClientTP/
shoonya.ws-url=wss://api.shoonya.com/NorenWSTP/

# ---------------------------------------------------------------------------
#  Credentials (required only when shoonya.mock=false).
#  Prefer supplying these via environment variables, e.g. SHOONYA_USER_ID.
# ---------------------------------------------------------------------------
shoonya.user-id=${SHOONYA_USER_ID:}
shoonya.password=${SHOONYA_PASSWORD:}
shoonya.vendor-code=${SHOONYA_VENDOR_CODE:}
shoonya.api-key=${SHOONYA_API_KEY:}
shoonya.imei=${SHOONYA_IMEI:abc1234}

# Two-factor: EITHER supply a ready 6-digit OTP in factor2,
# OR supply the TOTP secret and the app will generate the code for you.
shoonya.factor2=${SHOONYA_FACTOR2:}
shoonya.totp-secret=${SHOONYA_TOTP_SECRET:}

# ---------------------------------------------------------------------------
#  Instruments.  Format per item: EXCHANGE|TOKEN|DISPLAY_NAME  (comma separated)
#  Indices are always rendered at the top of the dashboard.
# ---------------------------------------------------------------------------
shoonya.indices=NSE|26000|NIFTY 50,BSE|1|SENSEX

# Watchlist scanned for gainers/losers. Tokens below are standard NSE tokens;
# verify against Shoonya's symbol master (NSE_symbols.txt) before live use.
shoonya.watchlist=\
  NSE|2885|RELIANCE,\
  NSE|11536|TCS,\
  NSE|1594|INFY,\
  NSE|1333|HDFCBANK,\
  NSE|4963|ICICIBANK,\
  NSE|3045|SBIN,\
  NSE|1660|ITC,\
  NSE|10604|BHARTIARTL,\
  NSE|1922|KOTAKBANK,\
  NSE|317|BAJFINANCE,\
  NSE|11483|LT,\
  NSE|3456|TATAMOTORS,\
  NSE|3499|TATASTEEL,\
  NSE|1348|HEROMOTOCO,\
  NSE|5258|INDUSINDBK,\
  NSE|881|DRREDDY,\
  NSE|3506|TITAN,\
  NSE|1394|HINDUNILVR,\
  NSE|15083|ADANIENT,\
  NSE|25|ADANIPORTS,\
  NSE|526|AXISBANK,\
  NSE|910|EICHERMOT,\
  NSE|1232|GRASIM,\
  NSE|1363|HINDALCO,\
  NSE|17963|MARUTI

# ---------------------------------------------------------------------------
#  Ranking / broadcast tuning
# ---------------------------------------------------------------------------
# How many gainers and losers to show per interval.
shoonya.top-n=10
# Push cadence to the browser (ms).
shoonya.broadcast-interval-ms=5000
# How long ticks are retained in memory (ms). Must exceed the largest window.
shoonya.retention-ms=720000
# Comma separated windows in seconds used for movement calculations.
shoonya.windows-seconds=15,30,60,120,300,600

# ---------------------------------------------------------------------------
#  Logging
# ---------------------------------------------------------------------------
logging.level.com.example.shoonyamonitor=INFO

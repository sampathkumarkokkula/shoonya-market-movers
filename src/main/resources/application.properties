# ---------------------------------------------------------------------------
#  Ranking / broadcast tuning
# ---------------------------------------------------------------------------
# How many gainers and losers to show per interval.
shoonya.top-n=10
# Push cadence to the browser (ms).
shoonya.broadcast-interval-ms=5000
# How long ticks are retained in memory (ms). Must exceed the largest window.
shoonya.retention-ms=720000
# Comma separated windows in seconds used for movement calculations.
shoonya.windows-seconds=15,30,60,120,300,600

# ---------------------------------------------------------------------------
#  Logging
# ---------------------------------------------------------------------------
logging.level.com.example.shoonyamonitor=INFO

# ===========================================================================
#  Shoonya Monitor - configuration
# ===========================================================================
server.port=8080
spring.application.name=shoonya-monitor

# ---------------------------------------------------------------------------
#  MODE
#  mock=true  -> generates synthetic ticks, runs with NO credentials.
#  mock=false -> connects to the live Shoonya (Finvasia) feed (needs a token).
# ---------------------------------------------------------------------------
shoonya.mock=true

# ---------------------------------------------------------------------------
#  Shoonya API endpoints.
#  Shoonya migrated to the OAuth API. The OLD NorenWClientTP / NorenWSTP
#  endpoints are RETIRED and now return HTTP 502. These are the live paths:
# ---------------------------------------------------------------------------
shoonya.rest-base=https://api.shoonya.com/NorenWClientAPI/
shoonya.ws-url=wss://api.shoonya.com/NorenWSAPI/

# ---------------------------------------------------------------------------
#  LIVE FEED AUTH (required only when shoonya.mock=false)
#
#  Shoonya now uses an OAuth flow. You obtain an access token ONCE per trading
#  session using Shoonya's OAuth scripts (GetAuthcode -> GenAcsTok exchange),
#  then paste it here. The app uses this token directly to open the feed.
#
#  Steps to get the access token (do this before starting the app):
#    1. Whitelist your static/public IP in the Shoonya API portal.
#    2. Run Shoonya's OAuth login (GetAuthcode) to get an auth code, then
#       exchange it for an access token (test_oauth.py / GenAcsTok).
#    3. Put the resulting access token in SHOONYA_ACCESS_TOKEN below.
#
#  Prefer supplying these via environment variables.
# ---------------------------------------------------------------------------
shoonya.user-id=${SHOONYA_USER_ID:}
# Optional: account id from the token exchange. Defaults to user-id if blank.
shoonya.account-id=${SHOONYA_ACCOUNT_ID:}

#  AUTH - choose ONE of the two options below:
#
#  Option A) Provide a ready access token (if you already have one):
shoonya.access-token=${SHOONYA_ACCESS_TOKEN:}
#
#  Option B) Provide the one-time auth code and let the app exchange it for an
#  access token. Log in via the OAuth URL in a browser; you get redirected to
#  a URL like  https://api.shoonya.com/?code=XXXXX#/  - paste the code below.
#  (You can paste just the code, or the whole URL; the #/ tail is ignored.)
#  This needs your OAuth app client-id (API key) and secret-code.
shoonya.auth-code=${SHOONYA_AUTH_CODE:}
shoonya.client-id=${SHOONYA_CLIENT_ID:}
shoonya.secret-code=${SHOONYA_SECRET_CODE:}

# ---------------------------------------------------------------------------
#  LEGACY QuickAuth credentials (DEPRECATED - the endpoint is retired).
#  Left here only for reference; they no longer establish a live feed.
# ---------------------------------------------------------------------------
shoonya.password=${SHOONYA_PASSWORD:}
shoonya.vendor-code=${SHOONYA_VENDOR_CODE:}
shoonya.api-key=${SHOONYA_API_KEY:}
shoonya.imei=${SHOONYA_IMEI:abc1234}
shoonya.factor2=${SHOONYA_FACTOR2:}
shoonya.totp-secret=${SHOONYA_TOTP_SECRET:}

# ---------------------------------------------------------------------------
#  Instruments.  Format per item: EXCHANGE|TOKEN|DISPLAY_NAME  (comma separated)
#  Indices are always rendered at the top of the dashboard.
# ---------------------------------------------------------------------------
shoonya.indices=NSE|26000|NIFTY 50,BSE|1|SENSEX

